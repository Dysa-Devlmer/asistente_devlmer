apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: staging
  labels:
    app: pos-venta-api
    environment: staging
data:
  # Application Config
  NODE_ENV: "staging"
  PORT: "3000"
  LOG_LEVEL: "debug"

  # Bootstrap API Config
  BOOTSTRAP_VERSION: "2.0.0"
  BOOTSTRAP_CATALOG_MAX_LIMIT: "100"
  BOOTSTRAP_DEFAULT_LIMIT: "50"

  # Sync Config (Fase 1)
  SYNC_BATCH_SIZE: "100"
  SYNC_MAX_RETRIES: "3"

  # Database Config (non-sensitive)
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  DB_CONNECTION_TIMEOUT: "30000"
  DB_IDLE_TIMEOUT: "10000"

  # Redis Config (non-sensitive)
  REDIS_DB: "0"
  REDIS_KEY_PREFIX: "staging:"
  REDIS_TTL_DEFAULT: "300"

  # Cache Config
  CACHE_ENABLED: "true"
  CACHE_TTL_CATALOG: "300"
  CACHE_TTL_EMPLOYEES: "600"

  # Security
  CORS_ENABLED: "true"
  CORS_ORIGIN: "https://staging-web.example.com"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW_MS: "60000"

  # Observability
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  SENTRY_ENVIRONMENT: "staging"
