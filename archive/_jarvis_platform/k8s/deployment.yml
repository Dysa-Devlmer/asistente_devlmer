# ============================================
# JARVIS Kubernetes Deployment Manifests
# Production-ready K8s configuration
# ============================================

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis-production
  labels:
    name: jarvis-production
    environment: production

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-config
  namespace: jarvis-production
data:
  NODE_ENV: "production"
  PORT: "7777"
  LOG_LEVEL: "info"
  ENABLE_METRICS: "true"

---
# Secret
apiVersion: v1
kind: Secret
metadata:
  name: jarvis-secrets
  namespace: jarvis-production
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme-in-production"
  REDIS_PASSWORD: "changeme-in-production"
  JWT_SECRET: "changeme-in-production"

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-backend
  namespace: jarvis-production
  labels:
    app: jarvis
    component: backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: jarvis
      component: backend
  template:
    metadata:
      labels:
        app: jarvis
        component: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7777"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: jarvis-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: backend
        image: ghcr.io/yourorg/jarvis-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 7777
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: jarvis-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: jarvis-config
              key: PORT
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jarvis-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jarvis-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 7777
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 7777
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: metrics
          mountPath: /app/metrics
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: jarvis-logs-pvc
      - name: metrics
        persistentVolumeClaim:
          claimName: jarvis-metrics-pvc

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-frontend
  namespace: jarvis-production
  labels:
    app: jarvis
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: jarvis
      component: frontend
  template:
    metadata:
      labels:
        app: jarvis
        component: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/yourorg/jarvis-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5173
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: jarvis-backend-service
  namespace: jarvis-production
  labels:
    app: jarvis
    component: backend
spec:
  type: ClusterIP
  selector:
    app: jarvis
    component: backend
  ports:
  - port: 7777
    targetPort: 7777
    protocol: TCP
    name: http
  sessionAffinity: ClientIP

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: jarvis-frontend-service
  namespace: jarvis-production
  labels:
    app: jarvis
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: jarvis
    component: frontend
  ports:
  - port: 5173
    targetPort: 5173
    protocol: TCP
    name: http

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis-ingress
  namespace: jarvis-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - jarvis.example.com
    - api.jarvis.example.com
    secretName: jarvis-tls
  rules:
  - host: jarvis.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jarvis-frontend-service
            port:
              number: 5173
  - host: api.jarvis.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jarvis-backend-service
            port:
              number: 7777

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jarvis-backend-hpa
  namespace: jarvis-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jarvis-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

---
# PersistentVolumeClaim for Logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-logs-pvc
  namespace: jarvis-production
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# PersistentVolumeClaim for Metrics
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-metrics-pvc
  namespace: jarvis-production
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard

---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jarvis-sa
  namespace: jarvis-production

---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jarvis-network-policy
  namespace: jarvis-production
spec:
  podSelector:
    matchLabels:
      app: jarvis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: jarvis-production
    ports:
    - protocol: TCP
      port: 7777
    - protocol: TCP
      port: 5173
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
